<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบวิทยุสื่อสาร (PocketBase)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- หัวข้อแอป -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">📻 ระบบตรวจสอบและบันทึกวิทยุสื่อสาร</h1>
            <p class="text-gray-600 text-sm">เชื่อมต่อระบบฐานข้อมูลออนไลน์ผ่าน PocketBase (<span class="text-blue-600 font-mono">pb.wd-security-app.com</span>)</p>
        </div>

        <!-- ฟอร์มบันทึกข้อมูล -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">📝 บันทึกผลการตรวจสอบเครื่องใหม่</h2>
            <form id="radioForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Serial Number / รหัสเครื่อง</label>
                    <input type="text" id="serialNo" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น ICOM-001">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รุ่นวิทยุสื่อสาร</label>
                    <input type="text" id="model" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น ICOM IC-G86">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน / แผนก</label>
                    <input type="text" id="user" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น แผนก 001">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">สถานะการตรวจสอบ</label>
                    <select id="status" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ปกติ (พร้อมใช้งาน)">🟢 ปกติ (พร้อมใช้งาน)</option>
                        <option value="แบตเสื่อม">🟡 แบตเสื่อม</option>
                        <option value="ส่งซ่อม">🔴 ส่งซ่อม</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">หมายเหตุเพิ่มเติม</label>
                    <input type="text" id="note" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น ปุ่ม PTT ค้าง, สายอากาศชำรุด (ถ้ามี)">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                        บันทึกข้อมูลลง PocketBase
                    </button>
                </div>
            </form>
        </div>

        <!-- รายการข้อมูลที่บันทึก -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-2">
                <h2 class="text-lg font-semibold text-gray-700">📊 ประวัติและรายการวิทยุทั้งหมด</h2>
                <input type="text" id="searchInput" placeholder="🔍 ค้นหา (Serial หรือ ชื่อผู้ใช้)..." class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                            <th class="p-3">Serial No.</th>
                            <th class="p-3">รุ่น</th>
                            <th class="p-3">ผู้ใช้งาน</th>
                            <th class="p-3">สถานะ</th>
                            <th class="p-3">หมายเหตุ</th>
                            <th class="p-3 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="radioTableBody" class="text-sm text-gray-700">
                        <tr><td colspan="6" class="p-4 text-center text-gray-400">กำลังโหลดข้อมูลจาก PocketBase...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- โหลด PocketBase JavaScript SDK -->
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
    <script>
        // เชื่อมต่อไปยัง PocketBase ของคุณ
        const pb = new PocketBase('https://pb.wd-security-app.com');

        const form = document.getElementById('radioForm');
        const tableBody = document.getElementById('radioTableBody');
        const searchInput = document.getElementById('searchInput');

        // ฟังก์ชันดึงข้อมูลจาก PocketBase มาแสดงผล
        async function fetchRadios(filterQuery = '') {
            try {
                let options = { sort: '-created' };
                if (filterQuery) {
                    options.filter = `serialNo ~ "${filterQuery}" || user ~ "${filterQuery}" || model ~ "${filterQuery}"`;
                }

                const records = await pb.collection('radios').getList(1, 50, options);
                renderTable(records.items);
            } catch (error) {
                console.error('Error fetching data:', error);
                tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">ไม่สามารถเชื่อมต่อฐานข้อมูลได้ (ตรวจสอบ CORS หรือสิทธิ์ Collection ใน PocketBase)</td></tr>`;
            }
        }

        // ฟังก์ชันบันทึกข้อมูลเมื่อกด Submit
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังบันทึก...';

            const newRadio = {
                serialNo: document.getElementById('serialNo').value,
                model: document.getElementById('model').value,
                user: document.getElementById('user').value,
                status: document.getElementById('status').value,
                note: document.getElementById('note').value || '-'
            };

            try {
                await pb.collection('radios').create(newRadio);
                form.reset();
                fetchRadios(); // โหลดข้อมูลใหม่ทันที
            } catch (error) {
                console.error('Error creating record:', error);
                alert('เกิดข้อผิดพลาดในการบันทึก: ' + (error.message || 'โปรดตรวจสอบความถูกต้อง'));
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'บันทึกข้อมูลลง PocketBase';
            }
        });

        // ฟังก์ชันลบข้อมูล
        window.deleteRadio = async function(id) {
            if(confirm('คุณต้องการลบรายการนี้ออกจาก PocketBase ใช่หรือไม่?')) {
                try {
                    await pb.collection('radios').delete(id);
                    fetchRadios();
                } catch (error) {
                    console.error('Error deleting record:', error);
                    alert('ไม่สามารถลบข้อมูลได้');
                }
            }
        }

        // แสดงผลลงในตาราง HTML
        function renderTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">ยังไม่มีข้อมูลในระบบ</td></tr>`;
                return;
            }

            data.forEach(r => {
                let statusColor = 'bg-green-100 text-green-800';
                if (r.status.includes('แบต')) statusColor = 'bg-yellow-100 text-yellow-800';
                if (r.status.includes('ซ่อม')) statusColor = 'bg-red-100 text-red-800';

                const row = document.createElement('tr');
                row.className = 'border-b border-gray-100 hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-3 font-medium">${r.serialNo}</td>
                    <td class="p-3">${r.model}</td>
                    <td class="p-3">${r.user}</td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">${r.status}</span></td>
                    <td class="p-3 text-gray-500">${r.note}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteRadio('${r.id}')" class="text-red-500 hover:text-red-700 text-xs font-semibold bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded transition">ลบ</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // ระบบค้นหาแบบ Real-time
        let searchTimer;
        searchInput.addEventListener('input', function(e) {
            clearTimeout(searchTimer);
            const keyword = e.target.value.trim();
            searchTimer = setTimeout(() => {
                fetchRadios(keyword);
            }, 300);
        });

        // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
        fetchRadios();
    </script>
</body>
</html>
